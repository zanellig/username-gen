<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Not shipped, not linked from manifest.json.
  Question: which icon survives 16px in the Chrome toolbar?
  Five variants (A–E), real PNGs rasterized by rsvg-convert from icons-prototype/svg/.
  The contact sheet compares all five; the bottom bar drops one into a fake toolbar
  at true size, switchable via ?variant=A|B|C|D|E.
  Re-render after editing an SVG: sh icons-prototype/render.sh
  Run: python3 -m http.server 8391   (from username-gen/)
       http://localhost:8391/icons-prototype.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Username Roller — icon variants</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 28px 24px 120px;
        background: #e9eaee;
        color: #14141c;
        font: 13px system-ui, sans-serif;
      }
      body[data-theme="dark"] { background: #141518; color: #edeef1; }

      h1 { font-size: 15px; margin: 0 0 4px; }
      .sub { margin: 0 0 24px; color: #6b7280; font-size: 12px; }
      body[data-theme="dark"] .sub { color: #8b8f9a; }

      /* ---------- contact sheet ---------- */
      table { border-collapse: collapse; width: 100%; max-width: 900px; }
      th {
        font: 11px ui-monospace, monospace;
        font-weight: 500;
        color: #6b7280;
        text-align: left;
        padding: 0 0 10px;
        letter-spacing: 0.04em;
      }
      body[data-theme="dark"] th { color: #8b8f9a; }
      td { padding: 14px 0; border-top: 1px solid #d3d5db; vertical-align: middle; }
      body[data-theme="dark"] td { border-top-color: #2a2c33; }
      td.key { font: 12px ui-monospace, monospace; width: 34px; }
      td.name { font-size: 12px; width: 190px; padding-right: 16px; }
      td.name small { display: block; color: #6b7280; font-size: 11px; margin-top: 2px; }
      body[data-theme="dark"] td.name small { color: #8b8f9a; }
      /* real pixels, no browser resampling */
      img { image-rendering: pixelated; display: block; }
      .zoom { width: 128px; height: 128px; }
      .sizes { display: flex; align-items: center; gap: 22px; }
      .sizes figure { margin: 0; display: grid; justify-items: center; gap: 6px; }
      .sizes figcaption { font: 10px ui-monospace, monospace; color: #9aa0ab; }
      tr[data-hot] td { background: rgb(91 91 214 / 0.07); }

      /* ---------- fake toolbar (where 16px is actually judged) ---------- */
      .toolbar {
        max-width: 900px;
        margin: 28px 0 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 10px;
        background: #dee1e6;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.06);
      }
      body[data-theme="dark"] .toolbar { background: #35363a; box-shadow: none; }
      .omni {
        flex: 1;
        height: 28px;
        border-radius: 999px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 12px;
        color: #6b7280;
      }
      body[data-theme="dark"] .omni { background: #202124; color: #9aa0ab; }
      .slot {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        display: grid;
        place-items: center;
      }
      .slot.hot { background: rgb(0 0 0 / 0.08); }
      body[data-theme="dark"] .slot.hot { background: rgb(255 255 255 / 0.1); }
      .slot svg { width: 16px; height: 16px; fill: none; stroke: #5f6368; stroke-width: 1.6; }
      body[data-theme="dark"] .slot svg { stroke: #c3c6cb; }

      /* ---------- switcher (not part of any design) ---------- */
      #bar {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 999px;
        background: #101114;
        color: #fff;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.35);
        font: 12px system-ui, sans-serif;
        z-index: 10;
      }
      #bar button {
        font: inherit;
        color: inherit;
        background: #26282e;
        border: 0;
        border-radius: 999px;
        padding: 5px 10px;
        cursor: pointer;
      }
      #bar #label { padding: 0 8px; min-width: 200px; text-align: center; }
      #bar .sep { width: 1px; height: 18px; background: #3a3d45; margin: 0 2px; }
    </style>
  </head>
  <body>
    <h1>Username Roller — icon variants</h1>
    <p class="sub">
      Every image below is a real PNG from <code>rsvg-convert</code>, shown at its
      native size (and at 8× nearest-neighbour, so you see the actual pixels).
      The only size that decides anything is 16.
    </p>

    <table>
      <thead>
        <tr>
          <th></th>
          <th>variant</th>
          <th>16 · 48 · 128 &nbsp;&nbsp;|&nbsp;&nbsp; 16 at 8×</th>
        </tr>
      </thead>
      <tbody id="sheet"></tbody>
    </table>

    <div class="toolbar">
      <div class="omni">example.com/signup</div>
      <div class="slot"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg></div>
      <div class="slot hot"><img id="inslot" width="16" height="16" alt="" /></div>
      <div class="slot"><svg viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="13" r="1.3"/></svg></div>
    </div>

    <div id="bar">
      <button id="prev" aria-label="Previous variant">←</button>
      <span id="label"></span>
      <button id="next" aria-label="Next variant">→</button>
      <span class="sep"></span>
      <button id="theme"></button>
    </div>

    <script type="module">
      const VARIANTS = {
        A: { name: "Solid die tile", note: "Brand tile, white pips. Reads as a button." },
        B: { name: "Field + caret", note: "Line art. The field being filled, not the roll." },
        C: { name: "Tilted die outline", note: "Rotated — tests if 12° survives the pixel grid." },
        D: { name: "Slot reels", note: "Abstract bars. No metaphor object to muddy." },
        E: { name: "Shuffle arrows", note: "Universal randomize glyph. Busiest at 16." },
      };
      const KEYS = Object.keys(VARIANTS);

      const s = {
        variant: KEYS.includes(new URL(location).searchParams.get("variant"))
          ? new URL(location).searchParams.get("variant")
          : "A",
        theme: "light",
      };

      document.getElementById("sheet").innerHTML = KEYS.map(
        (k) => `
        <tr data-key="${k}">
          <td class="key">${k}</td>
          <td class="name">${VARIANTS[k].name}<small>${VARIANTS[k].note}</small></td>
          <td>
            <div class="sizes">
              ${[16, 48, 128]
                .map(
                  (n) =>
                    `<figure><img src="icons-prototype/png/${k}-${n}.png" width="${n}" height="${n}" alt="${k} at ${n}" /><figcaption>${n}</figcaption></figure>`,
                )
                .join("")}
              <figure>
                <img class="zoom" src="icons-prototype/png/${k}-16.png" alt="${k} at 16, magnified" />
                <figcaption>16 @ 8×</figcaption>
              </figure>
            </div>
          </td>
        </tr>`,
      ).join("");

      function render() {
        document.getElementById("inslot").src = `icons-prototype/png/${s.variant}-16.png`;
        document.getElementById("label").textContent = `${s.variant} — ${VARIANTS[s.variant].name}`;
        document.body.dataset.theme = s.theme;
        document.getElementById("theme").textContent = s.theme === "dark" ? "☀ light" : "☾ dark";
        for (const tr of document.querySelectorAll("tr[data-key]")) {
          tr.toggleAttribute("data-hot", tr.dataset.key === s.variant);
        }
      }

      const go = (step) => {
        s.variant = KEYS[(KEYS.indexOf(s.variant) + step + KEYS.length) % KEYS.length];
        const url = new URL(location.href);
        url.searchParams.set("variant", s.variant);
        history.replaceState(null, "", url);
        render();
      };
      document.getElementById("prev").onclick = () => go(-1);
      document.getElementById("next").onclick = () => go(1);
      document.getElementById("theme").onclick = () => {
        s.theme = s.theme === "dark" ? "light" : "dark";
        render();
      };
      addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea, select, [contenteditable]")) return;
        if (e.key === "ArrowLeft") go(-1);
        if (e.key === "ArrowRight") go(1);
      });

      render();
    </script>
  </body>
</html>
