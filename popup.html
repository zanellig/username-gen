<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 290px;
        margin: 0;
        padding: 12px;
        font: 13px system-ui, sans-serif;
      }
      ul {
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
      }
      .username {
        text-align: left;
        border: 0;
        font-family: ui-monospace, monospace;
      }
      button:hover,
      button:focus-visible {
        background: #eef1f5;
      }
      button {
        width: 100%;
        padding: 7px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
      select { width: 100%; margin: 6px 0 10px; padding: 5px; }
      #status { margin: 10px 0 0; line-height: 1.4; }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1f22;
          color: #eee;
        }
        button:hover,
        button:focus-visible {
          background: #303237;
        }
        button {
          background: #26282c;
          color: #eee;
          border-color: #444;
        }
      }
    </style>
  </head>
  <body>
    <label for="destination">Use username in</label>
    <select id="destination" disabled><option value="">Copy to clipboard</option></select>
    <ul id="list" aria-label="Generated usernames"></ul>
    <button id="reroll">Reroll</button>
    <p id="status" role="status">Looking for username fields…</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
