<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 12px;
        font: 13px system-ui, sans-serif;
      }
      ul {
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
      }
      li {
        padding: 7px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-family: ui-monospace, monospace;
      }
      li:hover,
      li:focus {
        background: #eef1f5;
        outline: none;
      }
      li[data-copied]::after {
        content: " copied";
        color: #2c7;
      }
      button {
        width: 100%;
        padding: 7px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font: inherit;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1f22;
          color: #eee;
        }
        li:hover,
        li:focus {
          background: #303237;
        }
        button {
          background: #26282c;
          color: #eee;
          border-color: #444;
        }
      }
    </style>
  </head>
  <body>
    <ul id="list" aria-label="Generated usernames"></ul>
    <button id="reroll">Reroll</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
