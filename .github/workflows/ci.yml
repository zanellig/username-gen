name: Test and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Check versions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import manifest from './manifest.json' with { type: 'json' };
          import pkg from './package.json' with { type: 'json' };
          assert.equal(pkg.version, manifest.version, 'Package and extension versions must match');
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.match(process.env.GITHUB_REF_NAME, /^v\d+\.\d+\.\d+$/);
            assert.equal(process.env.GITHUB_REF_NAME, `v${manifest.version}`, 'Tag must match the extension version');
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Publish release with generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
